<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قصص الحفظيات التفاعلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1f4; --surface:#ffffff; --ink:#14202e; --muted:#5b6878; --line:#d5dbe3;
  --accent:#0f6b6e; --accent-ink:#ffffff; --accent-soft:#dcefee;
  --hl:#ffe45c; --hl-soft:rgba(255,228,92,.75);
  --seen:#b9e6cf; --seen-soft:rgba(185,230,207,.85);
  --reading:#eaf3fb; --ok:#1d7a4b; --warn-bg:#e8f5ec;
  --shadow:0 10px 30px rgba(20,32,46,.14);
  --ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --story:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1720; --surface:#17212d; --ink:#e8edf3; --muted:#9aa7b7; --line:#2b3746;
    --accent:#59c3c6; --accent-ink:#06282a; --accent-soft:#17383b;
    --hl:#f0cf2f; --hl-soft:rgba(240,207,47,.32);
    --seen:#4fa77c; --seen-soft:rgba(79,167,124,.35);
    --reading:#1c2d40; --ok:#6fd39c; --warn-bg:#173326;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1720; --surface:#17212d; --ink:#e8edf3; --muted:#9aa7b7; --line:#2b3746;
  --accent:#59c3c6; --accent-ink:#06282a; --accent-soft:#17383b;
  --hl:#f0cf2f; --hl-soft:rgba(240,207,47,.32);
  --seen:#4fa77c; --seen-soft:rgba(79,167,124,.35);
  --reading:#1c2d40; --ok:#6fd39c; --warn-bg:#173326;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.6}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:780px;margin:0 auto;padding:10px 16px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.brand h1{font-size:1.05rem;margin:0;font-weight:700}
.brand span{font-size:.82rem;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;cursor:pointer;text-align:center;line-height:1.3}
.tab b{display:block;font-size:.95rem}
.tab small{display:block;color:var(--muted);font-size:.74rem}
.tab[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-current="true"] small{color:var(--accent-ink);opacity:.85}
main{max-width:780px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 8px}
.s-title{margin:0;font-family:var(--story);font-size:1.9rem;line-height:1.2;text-align:left;direction:ltr}
.s-sub{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 4px;padding:12px 0;border-block:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn.primary[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:9px 12px;cursor:pointer;min-height:44px;border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tools select{min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:0 10px;font-family:inherit;max-width:190px}
.count{margin-inline-start:auto;color:var(--muted);font-size:.86rem}
.audio-note{color:var(--muted);font-size:.85rem;margin:6px 0 0}
.para{position:relative;margin:0;padding:14px 0;border-bottom:1px dashed var(--line);border-radius:8px}
.para:last-of-type{border-bottom:0}
.para.reading{background:var(--reading)}
.para .en{margin:0;padding-left:44px;padding-right:8px;font-family:var(--story);font-size:1.28rem;line-height:2.15;direction:ltr;text-align:left;color:var(--ink)}
.para .tr{margin:8px 0 2px;padding:10px 14px;background:var(--accent-soft);border-radius:10px;font-size:1.02rem;line-height:1.95;direction:rtl;text-align:right}
.pplay{position:absolute;left:0;top:14px;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:var(--surface);cursor:pointer;font-size:1rem;line-height:1}
.pplay:hover{border-color:var(--accent)}
.w{cursor:pointer;border-radius:4px;padding:0 2px;margin:0 -1px;
  background:linear-gradient(transparent 12%, var(--hl-soft) 12%, var(--hl-soft) 92%, transparent 92%);
  border-bottom:0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.w:hover{background:linear-gradient(transparent 12%, var(--hl) 12%, var(--hl) 92%, transparent 92%)}
.w.seen{background:linear-gradient(transparent 12%, var(--seen-soft) 12%, var(--seen-soft) 92%, transparent 92%)}
.nohl .w{background:none}
.nohl .w:hover{background:var(--hl-soft)}
.storynav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.storynav .btn{flex:1;min-height:52px;font-size:1.02rem}
.storynav .spacer{flex:1}
.done{margin:22px 0 4px;text-align:center;color:var(--muted);font-size:.95rem}
.pop{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.pop[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(8,14,22,.5)}
.sheet{position:relative;width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:640px){.pop{align-items:center}.sheet{border-radius:18px}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.close{position:absolute;top:10px;left:10px;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--surface);cursor:pointer;font-size:1.5rem;line-height:1}
.close:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;padding-left:54px}
.chip{font-size:.8rem;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--muted)}
.chip.cat{background:var(--accent-soft);border-color:transparent;color:var(--ink);font-weight:500}
.chip.fix{background:var(--warn-bg);border-color:transparent;color:var(--ok);font-weight:600}
.head-row{display:flex;align-items:center;gap:10px;direction:ltr}
.head{font-family:var(--story);font-size:1.7rem;line-height:1.25;font-weight:700;margin:0;text-align:left}
.say{flex:none;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:var(--surface);cursor:pointer}
.say:hover{border-color:var(--accent)}
.inst{margin:6px 0 0;color:var(--muted);font-size:.86rem;direction:ltr;text-align:left}
.sec{margin-top:16px}
.sec h3{margin:0 0 3px;font-size:.82rem;color:var(--muted);font-weight:500}
.sec .en-m{font-family:var(--story);font-size:1.08rem;direction:ltr;text-align:left;margin:0}
.sec .ar-m{font-size:1.28rem;font-weight:600;margin:0;white-space:pre-line}
.sec .note{margin:0;font-size:.92rem;background:var(--accent-soft);border-radius:10px;padding:8px 12px}
</style>
</head>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>قصص الحفظيات التفاعلية</h1><span>اضغط على أي كلمة مظلّلة لتظهر بطاقة معناها</span></div>

</div>

{
title:"The Silent Forest",
ar:"الغابة الصامتة",
units:"الوحدات 1 + 2 + 4",
p:[
"Lina was a journalist. Her editor {sendmsg|sent a message} early: cover a village losing its animals. Lina had to {spreadmsg|spread the message} to her readers, {carrymsg|carry the message} to the town, {conveymsg|convey the message} clearly, and {passonmsg|pass on the message} to her team. Every morning she began with a warm {greeting|greeting}. She had to {stayintouch|stay in touch}, {keeptouch|keep in touch}, and never {losetouch|lose touch} with her sources. Long ago she used to {establishcontact|establish contact} by letter, {maintaincontact|maintain contact} by phone, and try not to {losecontact|lose contact}. Now she'd use email to {makecontact|make contact}.",
"The story needed to {shedlight|shed light on} an environmental crisis. It was {publicint|in the public interest}, and she wanted to {comeup|come up with} a fresh angle. She felt {thrilled|thrilled} but {nervous|nervous} at once.",
"On the road, her phone could barely {pickup|pick up} a signal. In the fog she could only just {makeout|make out} the road. After hours of driving she {figureout|figured out} which turn to take.",
"On the way she met every kind of weather: {blistering|blistering heat} on the plains, {galeforce|gale-force winds} at the coast, {heavyrain|heavy rain} in the mountains, {highhumidity|high humidity} near the river, {soaring|soaring temperatures} in the desert, {subzero|sub-zero temperatures} last winter in the north, {torrential|torrential rain} in autumn, and {scorching|scorching heat} at noon. Local farmers called it {freak|freak weather}, and a long {drought|drought} had left the land dry.",
"At the village, some people were {frightened|frightened}, others {surprised|surprised}. An old woman was {sad|sad} and {tense|tense}. A young mother was {terrified|terrified} that her children would starve. The kids looked {bewildered|bewildered}, {confused|confused}, and {astonished|astonished} to see a stranger. When she explained the news, some were {devastated|devastated}, and one grandfather was {exasperated|exasperated} by the mayor. Later, when help finally arrived, a young girl was {ecstatic|ecstatic}.",
"Lina wanted to {favourable|make a favourable impression}, so she tried to {breakice|break the ice}. She {strikeup|struck up a conversation} with an old farmer and {smalltalk|made small talk}. She {compliment|paid him a compliment} about his olive trees, and they {havelaugh|had a laugh}. They {hititoff|hit it off} quickly, and he {taketoyou|took to her}. She hoped to {createbond|create a bond} without {comeacrossas|coming across as} pushy. Later she {comeacross|came across} a young shepherd too.",
"The farmer had lost his sheepdog, which used to {groom|groom} the flock. His neighbour kept a pig, an {omnivore|omnivore}. And his old {rival|rival} across the valley had gone silent too.",
"The farmer {pointout|pointed out} the dead trees. \"It's mostly {acidrain|acid rain}. It {resultfrom|results from} {exhaust|exhaust fumes} and {fossil|fossil fuels}. {duel|Due to} {globalwarming|global warming} the {greenhouse|greenhouse effect} {giverise|gives rise to} more heat. {erosion|Soil erosion} {leadto|leads to} {waterscarcity|water scarcity}. {asaresult|As a result of} {habitatloss|habitat loss}, many {endangered|endangered species} are gone. And {consequence|as a consequence of} pollution, our forest {resultin|results in} dead earth. {toxic|Toxic waste} from the factory is {hazardous|hazardous}. Even the {ozone|ozone layer} is thin, and {vehicleemis|vehicle emissions} choke us.\"",
"The farmer added, \"I read every report you {referto|refer to}. Your articles are {directedto|directed to} the ministry. We need to {learnabout|learn about} the crisis. Nobody has {controlover|control over} the factory. We need {renewable|renewable energy} and {windturbine|wind turbines}.\" Lina {takein|took in} every word.",
"The {primate|primates} here were {critically|critically endangered}, {nocturnal|nocturnal} and {solitary|solitary}. They {rely|rely on} the forest. A {predator|natural predator} was less dangerous than a {poacher|poacher} or a {pesticide|pesticide}. The factory could {wipeout|wipe out} the whole forest and {bringabout|bring about} disaster. She wanted to {getacross|get this message across}, so she {spellout|spelled out} every fact.",
"The old man told her about the wildlife: a {mammal|mammal} with a strong {backbone|backbone} and full {skeleton|skeleton}; a slow {reptile|reptile} with hard {scale|scales}; small {invertebrate|invertebrates} in the pond, mostly {crustacean|crustaceans}; a {marine|marine} bird visiting each spring. Some species were already {extinct|extinct}. The kids loved the {cuddly|cuddly}, {furry|furry} rabbits, but hated the {slimy|slimy} frogs. A big fish with a broken {fin|fin} lay by the shore. The forest, he said, {makeup|makes up} half the county.",
"The next day, a local official became angry. He {jumpdown|jumped down her throat}, {onspot|put her on the spot}, {firequestions|fired questions at her}, and {refusedrop|refused to let it drop}. He {lastword|insisted on having the last word}. Lina couldn't {wordedgeways|get a word in edgeways}. She was {annoyed|annoyed}, then {furious|furious}, and her editor was {livid|livid}.",
"To calm herself, she thought, \"{worstcould|What is the worst that could happen?}\" But she also said, \"{worriedsick|I'm worried sick about} this village. {keepupnight|It has been keeping me up at night}. {upthewall|The official is driving me up the wall}. {getsnerves|He really gets on my nerves}. {upto|I have had it up to here with} his lies.\"",
"A colleague heard the story and gasped: \"{kidding|You have got to be kidding me!}\" — \"{outofhere|Get out of here!}\" Another said, \"{whowould|Who would have thought it?}\" The villagers were {dumps|feeling a bit down in the dumps}, {bluephr|feeling a bit blue}, and the mothers were {heartbroken|heartbroken}.",
"Lina stayed professional. She had to {verify|verify her sources} and {bothsides|present both sides of the story}. She checked every {signsS|sign} (hint or clue), and had to {uncoverS|uncover} (expose) hidden facts. She would {stateS|state} her findings, never write a {fakeS|fake} (fraud) story, and always cite a {reliableS|reliable} (trustworthy) source. The whole affair was a {mysteryS|mystery} (enigma) at first, but wildlife had begun to {decreaseS|decrease} (go down). It was a {strangeS|strange} (bizarre) situation.",
"The mayor's office {release|released a statement} to {refute|refute the allegation}. Lina wrote a {hardhitting|hard-hitting} article to {exposecorr|expose corruption} and {raiseaw|raise awareness}, without {clickbait|clickbait headlines} — readers already have a short {attentionspan|attention span}. Her paper needed to {generaterev|generate revenue}, but not at the cost of truth. Her editor said: \"It's {newsworthy|newsworthy} and {exclusive|exclusive}, not just {sensational|sensational}. It's not {quirky|quirky} but {heartbreaking|heartbreaking}. Keep it {balanced|balanced} and {topical|topical}. Some remarks stay {offrecord|off the record}. The ending is {heartwarming|heartwarming}.\" Soon it {hitheadlines|hit the headlines} and {goviral|went viral}.",
"The mayor's office made an {accusation|accusation} and tried to {obstruct|obstruct} her work. Lina stood on the {pavement|pavement} outside city hall. The court ordered a {replacement|replacement} for the mayor after a formal {request|request}. Journalists filed a {suspension|suspension} paperwork amid great {tension|tension}. A friendly {activist|activist} helped Lina {putin|put in} her long report. She would {reportpolice|report the whole thing to the police}, {seize|seize the opportunity}, and expose the man who tried to {pose|pose} as innocent. Corruption was the true {subjectmatter|subject matter} of the story.",
"Her photographer Omar was {wandering|wandering} near the river when he {spotted|spotted} a small primate. He {peered|peered} through his lens, {glanced|glanced} at the sky, and {capture|captured the image}. His {landscape|landscape photo} was {poignant|poignant} and {evoke|evoked} strong feelings. He {compose|composed} it carefully, refusing a {cropped|cropped} version. A woman {shriek|shrieked} when she saw it. Some children {raced|raced} to see it and {yelled|yelled} with joy. An old man {shuffle|shuffled} past, {muttering|muttering} a prayer. A guard {tiptoe|tiptoed} away, and the official {bellowed|bellowed} at his men.",
"{obviously|Obviously} the animals were gone. {theoretically|Theoretically} they could return, but {presumably|presumably} many had died. {disappointingly|Disappointingly}, the mayor was silent. {foolishly|Foolishly}, one guard tried to flee. {surely|Surely} justice would come. {clearly|Clearly}, the village needed help. {personally|Personally}, Lina wanted to stay. She was {oblige|obliged} to stay for two weeks. She would {succeed|succeed}, and the court would {permit|permit} her to publish. Sales dropped {slightly|slightly} at first, then {considerably|considerably} — {nowherenear|nowhere near} the peak — but she pushed on. {fortunately|Fortunately}, the government soon announced the factory's shutdown. {apparently|Apparently} the {allegation|allegations} were true. {unbelievably|Unbelievably}, the activists were invited to the ministry.",
"\"{whowould|Who would have thought it?}\" said Lina. \"{sigh|I can breathe a sigh of relief} now. {weight|That is a weight off my mind}. {thankg|Thank goodness}!\" She felt {walkingair|walking on air}, and she couldn't {cantstop|stop smiling}.",
"Her editor called: \"I'm {torn|torn between} two headlines. I'm {onfence|on the fence about} the second.\" \"I'm having {secondthoughts|second thoughts},\" said Lina. \"I {cantmakeup|can't make up my mind}. I {cantfinger|can't put my finger on it, but} something is off.\" Another editor said, \"{doesntgrab|It doesn't grab me}. I think we're on the {wrongtrack|wrong track}. OK, but {anotheropt|another option might be} something simpler.\" \"{seriously|Seriously?!}\" Then someone said, \"{spoton|You're spot on!} — {absolute|That's what I was going to say! Absolutely!}\" And \"{goodpoint|That's a good point, but} we must be careful.\" \"{ontheone|On the one hand}, 'The Silent Forest' is strong, but on the other hand, it's very sad. {letsmake|So let's make a decision on this}. {shall|Shall we go with} 'The Silent Forest'?\" \"{lookslike|It looks as if we agree that} it's perfect.\"",
"At a conference Lina said: \"{gonnatalk|I'm going to be talking about} the forest today. {inother|In other words}, it's a global problem. {second|The second thing is} that ordinary people can act, {whereas|whereas} governments wait. {sumup|So, to sum up}: save the forest, save the future.\""

t:[
"كانت لينا صحفية. أرسل لها رئيس التحرير رسالة مبكرة: غطّي قصة قرية تفقد حيواناتها. كان عليها أن تنشر الرسالة إلى قرّائها، وأن تحملها إلى المدينة، وأن تنقل الرسالة بوضوح، وأن تمرّرها إلى فريقها. تبدأ كل يوم بتحية دافئة. كان عليها أن تبقى على تواصل وأن تحافظ على التواصل ولا تفقده أبدًا مع مصادرها. قبل زمن كانت تبدأ اتصالًا بالرسائل، وتحافظ عليه بالهاتف، وتحاول ألا تفقد الاتصال. أما الآن فتستعمل البريد الإلكتروني لإجراء الاتصال.",
"القصة تحتاج إلى تسليط الضوء على أزمة بيئية. الأمر في المصلحة العامة، وأرادت أن تبتكر زاوية جديدة. شعرت بالحماسة والتوتر في آنٍ معًا.",
"في الطريق، بالكاد كان هاتفها يلتقط الإشارة. وفي الضباب كانت بالكاد تميّز الطريق. بعد ساعات من القيادة، اكتشفت أخيرًا أي منعطف تسلك.",
"قابلت في الطريق كل أنواع الطقس: حرارة شديدة في السهول، ورياحًا عاتية عند الساحل، ومطرًا غزيرًا في الجبال، ورطوبة عالية قرب النهر، وارتفاعًا في درجات الحرارة في الصحراء، ودرجات حرارة دون الصفر في الشمال شتاءً، وأمطارًا غزيرة في الخريف، وحرًّا حارقًا ظهرًا. سمّاه المزارعون طقسًا غير اعتيادي، وقد ترك جفاف طويل الأرض جافة.",
"في القرية، كان بعضهم خائفًا، وآخرون مندهشين. امرأة عجوز كانت حزينة ومتوترة. أمّ شابة مرتعبة من أن يموت أطفالها جوعًا. الأطفال بدوا محتارين مرتبكين منذهلين لرؤية غريبة. حين شرحت الخبر، شعر بعضهم بالتحطّم، وثار جدّ ساخطًا على العمدة. لاحقًا، حين وصل العون أخيرًا، فرحت طفلة صغيرة فرحًا كبيرًا.",
"أرادت لينا أن تترك انطباعًا جيدًا فحاولت أن تكسر الجمود. بدأت محادثة مع مزارع مسنّ وتحدّثت معه حديثًا خفيفًا. جاملته على أشجار الزيتون فضحكا معًا. انسجما بسرعة، وبدأ يتقبّلها. أرادت أن تبني رابطًا دون أن تبدو ملحّة. وقابلت لاحقًا راعيًا شابًا بالصدفة.",
"كان المزارع قد فقد كلب راعيه الذي كان يُنظّف الفروة للأغنام. جاره يربّي خنزيرًا آكل لحوم ونباتات. ومنافسه القديم في الوادي المقابل صمت هو الآخر.",
"أشار المزارع إلى الأشجار الميتة. \"غالبًا الأمطار الحمضية. تنتج عن الأدخنة العادمة والوقود الأحفوري. بسبب الاحترار العالمي، ظاهرة الاحتباس الحراري تؤدي إلى حرارة أعلى. تعرية التربة تؤدي إلى شحّ المياه. نتيجة لفقدان الموائل الطبيعية، اختفت أنواع مهددة كثيرة. ونتيجة للتلوث، تنتهي غابتنا أرضًا ميتة. النفايات السامة من المصنع خطيرة. وحتى طبقة الأوزون فوقنا رقيقة، وانبعاثات المركبات تخنقنا.\"",
"أضاف المزارع: \"أقرأ كل تقرير تعودين إليه. مقالاتك موجَّهة إلى الوزارة. علينا أن نتعلّم عن الأزمة. لا أحد يتحكّم في المصنع. نحتاج إلى طاقة متجددة وتوربينات رياح.\" استوعبت لينا كل كلمة.",
"الرئيسيات هنا مهددة بالانقراض بشكل حرج، وليلية، وتعيش بمفردها. تعتمد على الغابة. المفترس الطبيعي أقل خطرًا من الصياد الجائر أو المبيد الحشري. يمكن للمصنع أن يدمّر الغابة كلها ويُحدث كارثة. أرادت أن توصل هذه الرسالة، فوضّحت كل حقيقة بالتفصيل.",
"حدّثها الرجل العجوز عن الحياة البرية: ثديي بعمود فقري قوي وهيكل عظمي كامل؛ زاحف بطيء بحراشف قاسية؛ لافقاريات صغيرة في البركة، أكثرها قشريات؛ وطائر بحري يزور المكان كل ربيع. بعض الأنواع منقرضة أصلًا. الأطفال يحبون الأرانب اللطيفة المفروة، ويكرهون الضفادع اللزجة. وسمكة كبيرة بزعنفة مكسورة رأت عند الشاطئ. الغابة، كما قال، تشكّل نصف المقاطعة.",
"في اليوم التالي، غضب مسؤول محلي. ردّ عليها بغضب، وأحرجها بأسئلة صعبة، ومطرها بالأسئلة، ورفض أن يترك الأمر. أصرّ أن تكون له الكلمة الأخيرة. لم تستطع لينا أن تقول كلمة. شعرت بالانزعاج، ثم الغضب الشديد، وكان رئيس تحريرها مغتاظًا.",
"لتهدّئ نفسها، فكّرت: \"ما أسوأ ما قد يحدث؟\" لكنها قالت أيضًا: \"أنا قلقة جدًا على هذه القرية. لم أنم من القلق. هذا المسؤول يدفعني إلى الجنون. يستفزّ أعصابي. لقد سئمت من أكاذيبه تمامًا.\"",
"سمع زميل لها القصة وشهق: \"لا أصدّقك!\" — \"اخرج من هنا!\" وقال آخر: \"مَن كان يظن ذلك؟\" كان أهل القرية يشعرون بالإحباط، بالحزن، وكانت الأمهات محطّمات القلوب.",
"بقيت لينا محترفة. كان عليها أن تتحقق من مصادرها وتعرض جانبي القصة. تفقّدت كل إشارة (تلميح أو دليل)، وكان عليها أن تكشف حقائق مخفية. ستصرّح بنتائجها، ولن تكتب قصة زائفة، وستستشهد دائمًا بمصدر موثوق. كانت القصة كلها لغزًا في البداية، لكن الحياة البرية بدأت تنقص. كان وضعًا غريبًا.",
"أصدرت العمدة بيانًا لدحض الادعاء. كتبت لينا مقالًا حادّ الانتقاد لفضح الفساد ورفع الوعي، بلا عناوين خادعة — فقرّاء اليوم لديهم مدى انتباه قصير. صحيفتها بحاجة إلى تحقيق الإيرادات، لكن ليس على حساب الحقيقة. قال رئيس التحرير: \"إنه جدير بالنشر وحصري، ليس فقط مثيرًا. ليس غريبًا بل مفجعًا. اجعليه متوازنًا وعلى الساعة. بعض التصريحات تبقى غير رسمية. الخاتمة تُثلج الصدر.\" وسرعان ما تصدّر العناوين وانتشر.",
"وجّه مكتب العمدة اتهامًا لها، وحاول أن يعرقل عملها. وقفت لينا على الرصيف أمام مبنى البلدية. أمرت المحكمة باستبدال العمدة بعد طلب رسمي. رفع الصحفيون وثائق تعليقه وسط توتر كبير. ساعد ناشط ودود لينا في تقديم تقريرها الطويل. ستُبلغ الشرطة، وتغتنم الفرصة، وتكشف الرجل الذي تظاهر بالبراءة. كان الفساد هو الموضوع الحقيقي للقصة.",
"كان مصوّرها عمر يتجوّل قرب النهر حين لاحظ رئيسًا صغيرًا. حدّق من خلال عدسته، لمح السماء، والتقط الصورة. صورته الأفقية كانت مؤثّرة واستحضرت مشاعر قوية. ركّبها بعناية، ورفض النسخة المقصوصة. صرخت امرأة حين رأتها. ركض أطفال ليروها وهتفوا فرحين. مرّ رجل عجوز متثاقلًا، وهو يتمتم بدعاء. ابتعد حارس على أطراف أصابعه، وزأر المسؤول في وجه رجاله.",
"من الواضح أن الحيوانات ذهبت. نظريًا يمكنها أن تعود، لكن من المفترض أن كثيرًا منها مات. ولمرارة الأمر، بقي العمدة صامتًا. حاول حارس بحماقة أن يهرب. بالتأكيد ستأتي العدالة. من الواضح أن القرية بحاجة إلى مساعدة. شخصيًا، أرادت لينا البقاء. كانت مُلزَمة بالبقاء أسبوعين. ستنجح، وستسمح لها المحكمة بالنشر. انخفضت المبيعات بشكل طفيف في البداية، ثم بشكل كبير — بعيدة كل البعد عن ذروتها — لكنها تابعت. لحسن الحظ، أعلنت الحكومة قريبًا إغلاق المصنع. على ما يبدو أن الادعاءات كانت صحيحة. بشكل لا يُصدَّق، دُعي الناشطون إلى الوزارة.",
"\"مَن كان يظن ذلك؟\" قالت لينا. \"أستطيع أن أتنفس الصعداء الآن. أخيرًا ارتحت. الحمد لله!\" شعرت بأنها تكاد تطير من الفرح، ولم تستطع التوقف عن الابتسام.",
"اتصل رئيس التحرير: \"أنا متردد بين عنوانين. لست متأكدًا بعد بشأن الثاني.\" \"بدأت أفكر بالأمر من جديد،\" قالت لينا. \"لا أستطيع أن أحسم قراري. لا أستطيع أن أحدد ما هو بالضبط، لكن شيئًا ما غير مضبوط.\" قال محرر آخر: \"العنوان لا يعجبني. أظن أننا نسلك الطريق الخاطئ. حسنًا، لكن قد يكون هناك خيار أبسط.\" \"بجدية؟!\" ثم قال أحدهم: \"معك حق تمامًا! هذا ما كنت سأقوله! تمامًا!\" و\"هذه نقطة جيدة، لكن علينا أن نتوخى الحذر.\" \"من ناحية، 'الغابة الصامتة' قوي، ومن ناحية أخرى، هو حزين جدًا. إذن دعونا نتّخذ قرارًا. فهل نختار 'الغابة الصامتة'؟\" \"يبدو أننا متفقون على أنه ممتاز.\"",
"في مؤتمر قالت لينا: \"سأتحدث اليوم عن الغابة. بعبارة أخرى، إنها مشكلة عالمية. النقطة الثانية هي أن الناس العاديين يستطيعون التصرف، بينما تنتظر الحكومات. باختصار: أنقذوا الغابة، أنقذوا المستقبل.\""
]

p:[
"Nour was a {digitalnomad|digital nomad}. She could {workremotely|work remotely} from any {coworking|co-working space}, and was always {onthemove|on the move}. She never wanted to be {tieddown|tied down to one place}, but she missed her {homecomforts|home comforts}. She wanted to {settledown|settle down} and {putroots|put down roots}. So she came back to her grandmother's old house.",
"The house was {compact|compact} but {cramped|cramped}, in a {denselypop|densely populated} area. A {mediumsized|medium-sized} home, but with {excess|excess} furniture, and the garden {confined|confined} to one corner. The council said it was {allowed|allowed} to change the kitchen, but {forbidden|forbidden} to touch the front wall. The changes had to be {managed|managed} carefully. Owners were {obliged|obliged} to tell the council, a permit was {required|required}, and only small changes were {permitted|permitted}. They {succeeded|succeeded} on the first try.",
"{comparedwith|Compared with} the old kitchen, the new one was {much|much} better. {incomparison|In comparison with} the old oven, the new one was {alot|a lot} quieter. The old fridge was {far|far} worse, the old sink was {miles|miles} dirtier, the layout was {way|way} more cramped. The window was {abit|a bit} bigger, {slightlyD|slightly} taller, and {marginally|marginally} wider. It was {considerablyD|considerably} more expensive and {significantlyD|significantly} newer. But it was {notnearly|not nearly} as noisy as before, and {nothinglike|nothing like} the flat next door. The paint was old, {whereasbut|whereas} the walls were new.",
"They had to {carryout|carry out} many repairs. Nour tried to {mend|mend} a {leakingpipe|leaking pipe}, and Sami {replace|replaced} the bulb — a {changebulb|change bulb} task. He also fixed a {flattyre|flat tyre} and examined a {scratched|scratched screen}. They wanted to {getridof|get rid of} a huge {carpetstain|carpet stain}, so Nour used a {dishcloth|dishcloth} to {mopup|mop up} a {puddle|puddle}. Then she used a {dustpan|dustpan} and {brush|brush} to {sweepup|sweep up} some {shattered|shattered glass}.",
"They found a box of {tangled|tangled leads}, a jumper that had {shrink|shrunk}, and a cloth {soak|soaked} in paint. They used {maskingtape|masking tape} to {label|label} every box, but {runout|ran out of} paint on Friday. Everything {breakdown|broke down} that week. Slowly they began to {doup|do up} the house: {decorate|decorate the room}, {clearup|clear up}, {wipedown|wipe down} walls, {pickupobj|pick up} tools, {fix|fix} what they could, and {remove|remove} the rest.",
"The house was full of sounds. They heard a {bee|bee buzzing}, {birds|birds chirping}, a {balloon|balloon popping}, and a {humming|machine humming}. Outside: the {roar|roar of an engine}, the {rustling|rustling of paper}, a {thud|thud} in the attic, and a {screech|parrot screeching} next door. Last winter, they had heard the {crunchsnow|crunching of snow} under their boots. The kitchen fan was almost {deafening|deafening}, but the whole project was {fascinating|fascinating}. The old wallpaper was {ridiculous|ridiculous}, but not truly {silly|silly}. It was {loud|loud} and {interesting|interesting} at once. Cooking made her sister {scared|scared} of the fire.",
"Every surface had a texture. The wall was {coarse|coarse}, curtains {silky|silky}, pillows {fluffy|fluffy}, garden bush {spiky|spiky}. The old sofa was {squishy|squishy}, the table {sticky|sticky} with jam. Then came the smells: the {aroma|aroma} of fresh bread, the {scent|scent} of jasmine — but the {smelly|smelly} basement had a terrible {stench|stench}. One smell was {overpowering|overpowering}, another {subtle|subtle}.",
"For the charity dinner, Nour cooked. She had to {slice|slice} onions, {peel|peel} potatoes, and heat a {pan|pan}. She {stir|stirred} the sauce and let it {simmer|simmer}, while water began to {boil|boil} and the {sizzle|meat sizzling} filled the kitchen. Sami used a {foodprocessor|food processor} to {whizz|whizz} the soup into a {puree|puree}. They had to {chill|chill} the dessert.",
"Nour tasted everything. The soup was {mouthwater|mouth-watering} but too {bland|bland}, so she added spices to make it {spicy|spicy}. The sauce was {thick|thick}, not {runny|runny} or {watery|watery}. Salad was {crunchy|crunchy}, hummus {smooth|smooth}, cheese {mild|mild}. She liked {savoury|savoury} food, and the dish was {tasty|tasty}. One dessert was {gross|gross}, but the cake was {impressive|impressive} and even {mindblowing|mind-blowing}. Her sister, {petrified|petrified} of cooking, laughed.",
"\"{whichprefer|Which would you prefer}, soup or salad?\" asked Sami. \"{whatrather|What would you rather do} — try new food or stick to old?\" \"I {prefergerund|prefer having} soup to eating salad,\" said Nour. \"{donteither|I don't like either of them},\" said their sister. \"{likeboth|I like them both equally},\" said Nour. \"{genfavour|I generally favour} hot over cold. {prefer|I'd prefer} soup. {rather|I'd rather} have soup. {sooner|I'd sooner do} the dishes than cook.\" \"{givenchoice|Given the choice},\" said Sami, \"{goforany|I'd go for pasta any day, every time}. {slight|I have a slight preference for} salad.\" \"{itsup|It's up to you},\" said Nour. \"{yourcall|It's your call}. {easy|I'm easy}. {whatever|Whatever you prefer}.\"",
"Nour had been {blind|blind} to the problems at first — {vision|vision} improves with age. Some neighbours were literally {blind|blind}. She wanted to {pursue|pursue} a career in charity. Some people tried to {putoff|put her off}, but she was {tough|tough}. She wanted to {realise|realise} her dream and {cometoterms|come to terms with} her fear. She was {capableof|capable of} much more; she had to {adjustto|adjust to} a new life. She was {desperate|desperate to} {spreadword|spread the word about} the dinner.",
"Nour saw that {brokenpipes|broken pipes} could {contaminate|contaminate fresh water supplies}. Many {envprob|environmental problems} were coming, and {naturaldis|natural disasters} made them worse. The dinner would {installtoilets|install new toilets} and {waterfilters|provide water filters}. She also talked about {poverty|poverty}, {unemployment|unemployment}, {homelessness|homelessness}, {racism|racism}, {genderequality|gender equality}, and {immigration|immigration}. She cared about {health|health} and the {environment|environment}. People need {facilities|facilities} and {opportunities|opportunities}. Every {institution|institution} must {enforce|enforce} the law and give {equal|equal} rights. Nobody can {justify|justify} racism.",
"Nour wanted to {prove|prove} that ordinary people can help. She had to {test|test} the pipes; {overword|over} fifty households were affected. The tank sat {aboveword|above} the roof. {infact|In fact}, {thefact|the fact that} the pipes were old made the leak worse. She had to {setup|set up} a stall and {setout|set out} the chairs. She wanted to {expand|expand} next year. She looked at things from a {differentangle|different angle}, wrote {brightideas|bright ideas} on a board, and asked everyone to {sharethoughts|share their thoughts}. Her brother wanted to {provesright|prove her right}.",
"Volunteers had to {participate|participate in} the work. They would {protectagainst|protect the guests against} the cold, and {dealwith|deal with} every problem calmly. Families {livein|live in} tiny apartments and {liveon|live on} little money — they had to {surviveon|survive on} very little. Nour told the children to {takefrom|learn from} experts. Volunteers {callout|called out} greetings, warned about the {dangerto|danger to} children, and gave {helpto|help to} the elderly.",
"A young {intern|intern} joined the team. She was {industrious|industrious}, but {illequipped|ill-equipped} for the cold. A local {foundation|foundation} sent money; an {anonymous|anonymous} donor sent a big cheque. All the {proceeds|proceeds} went to the cause; nobody took a {commission|commission}. Every volunteer was {integral|integral} to the night. A neighbour tried to {fatshame|fat-shame} the intern, {mock|mock} her, and {humiliate|humiliate} her {maliciously|maliciously}. She {shrugoff|shrugged it off} and said, \"I'll {lastlaugh|have the last laugh}.\""

t:[
"كانت نور رحّالة رقمية. تستطيع أن تعمل عن بعد من أي مساحة عمل مشتركة، وكانت دائمة التنقل. لم ترد أن تكون مقيَّدة بمكان واحد، لكنها كانت تفتقد وسائل الراحة المنزلية. أرادت أن تستقر وأن تُنبت جذورها. فعادت إلى بيت جدتها العتيق.",
"البيت مدمج لكنه ضيّق، في منطقة مكتظّة بالسكان. بيت متوسط الحجم، لكن بأثاث فائض، والحديقة مقيَّدة في زاوية واحدة. قال المجلس البلدي إن تغيير المطبخ مسموح، لكن يمنع لمس الجدار الأمامي. التغييرات يجب أن تُدار بعناية. المالكون ملزمون بإبلاغ المجلس، والتصريح مطلوب، ويسمح فقط بتغييرات صغيرة. نجحوا من المحاولة الأولى.",
"مقارنةً بالمطبخ القديم، الجديد أفضل بكثير. للمقارنة مع الفرن القديم، الجديد أهدأ بكثير. الثلاجة القديمة أسوأ بكثير، والمغسلة القديمة أوسخ بكثير جدًا، والتصميم القديم أضيق بكثير. النافذة أكبر قليلًا، وأعلى قليلًا، وأعرض بشكل طفيف. أغلى بشكل ملحوظ وأحدث بشكل ملحوظ. لكنه ليس صاخبًا كالسابق أبدًا، ولا يشبه إطلاقًا الشقة المجاورة. الطلاء قديم، بينما الجدران جديدة.",
"كان عليهم تنفيذ إصلاحات كثيرة. حاولت نور إصلاح أنبوب مسرِّب، واستبدل سامي المصباح — مهمة تغيير مصباح. أصلح أيضًا إطارًا مثقوبًا وفحص شاشة مخدوشة. أرادوا التخلّص من بقعة كبيرة على السجاد، فاستعملت نور قطعة قماش لتنظف بركة ماء. ثم استعملت جاروف الغبار والفرشاة لكنس زجاج محطَّم.",
"وجدوا صندوقًا من الأسلاك المتشابكة، وسترة انكمشت، وقطعة قماش منقوعة في الطلاء. استعملوا شريطًا لاصقًا لعنونة كل صندوق، لكن نفد الطلاء يوم الجمعة. تعطّل كل شيء ذلك الأسبوع. ببطء بدأوا يجدّدون البيت: يزيّنون الغرفة، ينظّفون، يمسحون الجدران، يلتقطون الأدوات، يصلحون ما يستطيعون، ويزيلون الباقي.",
"البيت مليء بالأصوات. سمعوا طنين نحل، وزقزقة طيور، وفرقعة بالون، وأزيز آلة. في الخارج: هدير محرك، وحفيف ورق، وصوت مكتوم في العلّية، وصراخ ببغاء في البيت المجاور. الشتاء الماضي، سمعوا سحق الثلج تحت حذائهم. مروحة المطبخ كانت تكاد تصمّ الآذان، لكن المشروع كله كان ساحرًا. الورق القديم كان سخيفًا، لكن ليس أحمق بحق. كان صاخبًا وممتعًا في الوقت نفسه. الطبخ جعل أختها خائفة من النار.",
"كل سطح له ملمس. الجدار خشن، الستائر حريرية، الوسائد منفوشة، شجيرة الحديقة شائكة. الأريكة القديمة طرية ورخوة، الطاولة لزجة بالمربى. ثم جاءت الروائح: عبق الخبز الطازج، وشذى الياسمين — لكن القبو كريه الرائحة كان له نتانة رهيبة. رائحة واحدة كانت طاغية، وأخرى خفيفة.",
"من أجل عشاء الخير، طبخت نور. كان عليها تقطيع البصل شرائح، وتقشير البطاطا، وتسخين المقلاة. قلّبت الصلصة وتركتها تُطبخ على نار هادئة، بينما بدأ الماء يغلي وطشطشة اللحم تملأ المطبخ. استعمل سامي محضّرة الطعام ليخلط الحساء إلى هريس. كان عليهم أن يبرّدوا الحلوى.",
"تذوّقت نور كل شيء. الحساء يسيل له اللعاب لكنه خالٍ من النكهة، فأضافت البهار ليصبح متبّلًا. الصلصة كثيفة، ليست سائلة أو مخفَّفة. السلطة مقرمشة، الحمص ناعم، الجبن لطيف المذاق. تحب الطعام المالح الشهي، والطبق لذيذ. حلوى واحدة كانت مقززة، لكن الكعكة مثيرة للإعجاب بل مذهلة. أختها المرتعبة من الطبخ ضحكت.",
"\"أيّهما تفضّل، الحساء أم السلطة؟\" سأل سامي. \"أيّهما تفضّل أن تفعل — تجرّب طعامًا جديدًا أم تلتزم بالقديم؟\" \"أفضّل تناول الحساء على السلطة،\" قالت نور. \"لا يعجبني أيّهما،\" قالت أختهم. \"يعجبانني بالتساوي،\" قالت نور. \"أفضّل عمومًا الحار على البارد. أفضّل الحساء. كنت أفضّل الحساء. كنت أفضّل غسل الصحون على الطبخ.\" \"لو أُتيح لي الاختيار،\" قال سامي، \"أختار المعكرونة في أي وقت. لدي ميل طفيف إلى السلطة.\" \"الأمر عائد إليك،\" قالت نور. \"القرار قرارك. لا مانع لديّ. أيًّا كان ما تفضّله.\"",
"كانت نور غير مدركة للمشاكل في البداية — الرؤية تتحسّن مع العمر. بعض الجيران كانوا مكفوفين حرفيًا. أرادت أن تمارس مهنة في العمل الخيري. حاول بعضهم أن يُثبّطها، لكنها كانت قوية. أرادت أن تحقّق حلمها وأن تتقبّل خوفها. كانت قادرة على أكثر بكثير؛ كان عليها أن تتكيّف مع حياة جديدة. كانت تتوق بشدة إلى نشر الخبر عن العشاء.",
"رأت نور أن الأنابيب المكسورة قد تلوّث إمدادات المياه العذبة. كانت مشاكل بيئية كثيرة تلوح في الأفق، والكوارث الطبيعية تجعلها أسوأ. سيموّل العشاء تركيب مراحيض جديدة وتوفير فلاتر مياه. تحدّثت أيضًا عن الفقر، والبطالة، والتشرّد، والعنصرية، والمساواة بين الجنسين، والهجرة. كانت تهتم بالصحة والبيئة. الناس بحاجة إلى مرافق وفرص. كل مؤسسة يجب أن تفرض القانون وأن تمنح حقوقًا متساوية. لا أحد يستطيع تبرير العنصرية.",
"أرادت نور أن تثبت أن الناس العاديين يستطيعون المساعدة. كان عليها أن تفحص الأنابيب؛ أكثر من خمسين أسرة تأثّرت. الخزّان يقع فوق السطح. في الحقيقة، الحقيقة أن الأنابيب قديمة جعلت التسرّب أسوأ. كان عليها أن تركّب طاولة عرض وأن ترتّب الكراسي. أرادت أن توسّع العمل السنة القادمة. نظرت إلى الأمور من زاوية مختلفة، كتبت أفكارًا مشرقة على لوح، وطلبت من الجميع أن يشاركوا بأفكارهم. أخوها أراد أن يُثبت صحة رأيها.",
"كان على المتطوعين المشاركة في العمل. سيحمون الضيوف من البرد ويتعاملون مع كل مشكلة بهدوء. العائلات تعيش في شقق صغيرة وتعتمد على مال قليل — كان عليهم أن يعيشوا بالقليل. أخبرت نور الأطفال أن يتعلّموا من الخبراء. المتطوعون كانوا ينادون بالتحية، ويحذّرون من الخطر على الأطفال، ويقدّمون العون لكبار السن.",

    div.innerHTML=inner;
    parasEl.appendChild(div);
  });
  fillVoices(); updateAudioUI();
}

/* اختيار الأصوات */
function fillVoices(){
  const sel=$("#voiceSel"); if(!sel) return;
  const list=(speechSynthesis.getVoices()||[]).filter(v=>v.lang.startsWith("en"));
  if(!list.length){sel.innerHTML='<option>—</option>';return}
  sel.innerHTML=list.map(v=>`<option value="${v.name}">${v.name} (${v.lang})</option>`).join("");
  if(!state.voice||!list.find(v=>v.name===state.voice)){
    const pref=list.find(v=>/female|zira|jenny|aria|samantha/i.test(v.name))
             ||list.find(v=>v.lang==="en-US")||list[0];
    state.voice=pref.name;
  }
  sel.value=state.voice;
}
if(typeof speechSynthesis!=="undefined"){
  speechSynthesis.onvoiceschanged=fillVoices;
}

/* البحث في القاموس مع المرادفات */
function lookupKey(k){
  return D[k];
}

/* فتح بطاقة الكلمة */
function openWord(k){
  const e=lookupKey(k); if(!e) return;
  const [head,pos,cat,en,ar,fx]=e;
  state.seen[state.cur].add(k);
  const seenNum=state.seen[state.cur].size;
  const cnt=$(".count"); if(cnt){const total=cnt.textContent.match(/من (\d+)/)[1]; cnt.textContent=`تم استعراض ${seenNum} من ${total} كلمة`}
  $$(`.w[data-k="${k}"]`).forEach(el=>el.classList.add("seen"));
  const chips=[];
  if(pos && POS[pos]) chips.push(`<span class="chip">${POS[pos]}</span>`);
  if(cat && CAT[cat]) chips.push(`<span class="chip cat">${CAT[cat]}</span>`);
  if(fx) chips.push(`<span class="chip fix">✓ تم تصحيح المعنى</span>`);
  $("#pChips").innerHTML=chips.join("");
  $("#pHead").textContent=head;
  const s=STORIES[state.cur];
  let inst="";
  for(const p of s.p){
    const m=p.match(new RegExp(`\\{${k}\\|([^}]+)\\}`));
    if(m){inst=`في القصة: "${m[1]}"`; break}
  }
  $("#pInst").textContent=inst;
  let body="";
  const note=CAT_NOTE[cat];
  if(en) body+=`<div class="sec"><h3>المعنى بالإنجليزية</h3><p class="en-m">${en}</p></div>`;
  if(ar) body+=`<div class="sec"><h3>المعنى بالعربية</h3><p class="ar-m">${ar}</p></div>`;
  if(note) body+=`<div class="sec"><p class="note">📌 ${note}</p></div>`;
  $("#pBody").innerHTML=body;
  pop.hidden=false; $("#pClose").focus();
}
function closeWord(){pop.hidden=true}

/* نطق كلمة واحدة */
function speakWord(text){
  if(typeof speechSynthesis==="undefined") return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=Math.max(0.5,state.rate); u.pitch=1; u.lang="en-US";
  const v=(speechSynthesis.getVoices()||[]).find(x=>x.name===state.voice);
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}

/* قراءة كل القصة أو فقرة تلو فقرة */
function speakAll(step){
  if(typeof speechSynthesis==="undefined"){alert("متصفحك لا يدعم النطق"); return}
  speechSynthesis.cancel();
  const paras=STORIES[state.cur].p.map(stripTags);
  state.play={on:true,paused:false,idx:-1,utter:null,paraSpans:$$("#paras .para"),active:-1,q:paras,stepMode:!!step};
  playNext();
}
function playNext(){
  const q=state.play.q;
  state.play.idx++;
  if(!state.play.on||state.play.idx>=q.length){stopAudio();return}
  highlight(state.play.idx);
  const u=new SpeechSynthesisUtterance(q[state.play.idx]);
  u.rate=Math.max(0.5,state.rate); u.pitch=1; u.lang="en-US";
  const v=(speechSynthesis.getVoices()||[]).find(x=>x.name===state.voice);
  if(v) u.voice=v;
  u.onend=()=>{
    if(!state.play.on) return;
    if(state.play.stepMode){pauseAudio();updateAudioUI();return}
    setTimeout(playNext,180);
  };
  state.play.utter=u;
  speechSynthesis.speak(u);
  updateAudioUI();
}
function speakFrom(i){
  if(typeof speechSynthesis==="undefined") return;
  speechSynthesis.cancel();
  const paras=STORIES[state.cur].p.map(stripTags);
  state.play={on:true,paused:false,idx:i-1,utter:null,paraSpans:$$("#paras .para"),active:-1,q:paras,stepMode:false};
  playNext();
}
function highlight(i){
  $$("#paras .para").forEach(p=>p.classList.remove("reading"));
  const el=$(`#paras .para[data-i="${i}"]`);
  if(el){el.classList.add("reading");el.scrollIntoView({behavior:"smooth",block:"center"})}
  state.play.active=i;
}
function pauseAudio(){if(typeof speechSynthesis!=="undefined"&&speechSynthesis.speaking){speechSynthesis.pause();state.play.paused=true;updateAudioUI()}}
function resumeAudio(){if(typeof speechSynthesis!=="undefined"&&speechSynthesis.paused){speechSynthesis.resume();state.play.paused=false;updateAudioUI()}}
function stopAudio(){if(typeof speechSynthesis!=="undefined")speechSynthesis.cancel();state.play={on:false,paused:false,idx:-1,utter:null,paraSpans:null,active:-1,q:[]};$$("#paras .para").forEach(p=>p.classList.remove("reading"));updateAudioUI()}
function stepNext(){
  if(!state.play.on){speakAll(true);return}
  if(state.play.paused){state.play.paused=false;playNext();return}
  playNext();
}
function updateAudioUI(){
  const bp=$("#btnPlay"),bs=$("#btnStep"),bpa=$("#btnPause");
  if(bp) bp.setAttribute("aria-pressed", state.play.on&&!state.play.stepMode?"true":"false");
  if(bs) bs.setAttribute("aria-pressed", state.play.on&&state.play.stepMode?"true":"false");
  if(bpa) bpa.setAttribute("aria-pressed", state.play.paused?"true":"false");
}

/* تنقّل بين القصص */
function go(i){
  if(i<0||i>=STORIES.length) return;
  state.cur=i; stopAudio(); render(); renderTabs();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* الأحداث */
document.addEventListener("click",ev=>{
  const t=ev.target;
  if(t.classList.contains("w")){openWord(t.dataset.k);return}
  if(t.classList.contains("pplay")){speakFrom(+t.dataset.i);return}
  if(t.id==="pClose"||t.id==="backdrop"){closeWord();return}
  if(t.id==="pSay"){speakWord($("#pHead").textContent);return}
  if(t.id==="btnPlay"){state.play.on&&!state.play.stepMode?stopAudio():speakAll(false);return}
  if(t.id==="btnStep"){stepNext();return}
  if(t.id==="btnPause"){state.play.paused?resumeAudio():pauseAudio();return}
  if(t.id==="btnStop"){stopAudio();return}
  if(t.id==="btnTr"){state.showTr[state.cur]=!state.showTr[state.cur];render();return}
  if(t.id==="btnHl"){state.hl=!state.hl;render();return}
  if(t.id==="prev"){go(state.cur-1);return}
  if(t.id==="next"){go(state.cur+1);return}
  if(t.dataset&&t.dataset.r){state.rate=parseFloat(t.dataset.r);$$(".seg button").forEach(b=>b.setAttribute("aria-pressed", b===t?"true":"false"));return}
});
document.addEventListener("change",ev=>{
  if(ev.target.id==="voiceSel"){state.voice=ev.target.value}
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&!pop.hidden){closeWord()}
  if(ev.key==="Enter"&&ev.target.classList&&ev.target.classList.contains("w")){openWord(ev.target.dataset.k)}
});

renderTabs(); render();
</script>
</body>
</html>
